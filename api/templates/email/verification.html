<!-- templates/email/verification.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verification Code</title>
    <style>
      body { 
        font-family: 'Segoe UI', Arial, sans-serif; 
        background: linear-gradient(135deg, #f7f9fc 0%, #f1f5fd 100%);
        margin: 0; 
        padding: 0; 
      }
      .container { 
        max-width: 500px; 
        margin: 30px auto; 
        background: #fff; 
        padding: 40px 30px; 
        border-radius: 16px; 
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); 
        text-align: center; 
        border: 1px solid rgba(59, 130, 246, 0.1);
      }
      .logo { 
        margin-bottom: 25px; 
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(59, 130, 246, 0.1);
      }
      .code-container {
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        border-radius: 12px;
        padding: 15px;
        margin: 25px 0;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
      }
      .code { 
        font-size: 38px; 
        font-weight: 800; 
        letter-spacing: 8px; 
        margin: 0; 
        color: #fff; 
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #1e3a8a;
        margin: 0 0 15px 0;
        font-weight: 700;
        font-size: 24px;
      }
      .note { 
        font-size: 15px; 
        color: #4b5563; 
        line-height: 1.5;
        margin: 20px 0;
      }
      .footer { 
        margin-top: 30px; 
        font-size: 13px; 
        color: #6b7280; 
        padding-top: 20px;
        border-top: 1px solid rgba(59, 130, 246, 0.1);
      }
      .icon {
        display: inline-block;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        border-radius: 50%;
        margin: 10px 0 20px;
        position: relative;
      }
      .icon:before {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <!-- inline image via cid -->
        <img src="cid:bv_logo" alt="Rushhourcamp" width="120" style="border-radius:8px;" />
      </div>
      <h2>Your verification code</h2>
      <div class="icon"></div>
      <div class="code-container">
        <div class="code">{{ code }}</div>
      </div>
      <p class="note">Use this code to complete creating your Superadmin account. This code expires in 10 minutes.</p>
      <div class="footer">
        <p>Questions? Reply to this email.</p>
      </div>
    </div>
  </body>
</html>
